[project]
name = "micrograd"
version = "0.1.0"
description = "A tiny scalar-valued autograd engine with a small PyTorch-like neural network library on top."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andrej Karpathy", email = "andrej.karpathy@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev  = ["pytest"]
cpu  = ["torch>=2.11.0"]
cuda = ["torch>=2.11.0"]
rocm = ["torch>=2.11.0 ; sys_platform == 'linux'", "triton-rocm==3.6.0 ; sys_platform == 'linux'"]

[tool.uv]
python-preference = "managed"
conflicts = [[{ group = "cpu" }, { group = "cuda" }, { group = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "rocm", group = "rocm" },
    { index = "cuda", group = "cuda" },
    { index = "cpu", group = "cpu" },
]
triton-rocm = { index = "rocm" }

[[tool.uv.index]]
name = "rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["micrograd"]
